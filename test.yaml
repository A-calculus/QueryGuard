messari_asset_ath_examples:
  - name: "Get Bitcoin and Ethereum ATH"
    description: "Get All-Time High data for Bitcoin and Ethereum"
    function_call: "get_messari_asset_ath(slugs=['bitcoin', 'ethereum'])"
    parameters:
      slugs: ["bitcoin", "ethereum"]
      limit: 20

  - name: "Get Top Cryptocurrencies ATH"
    description: "Get All-Time High data for top 5 cryptocurrencies"
    function_call: "get_messari_asset_ath(category='Cryptocurrency', limit=5)"
    parameters:
      category: "Cryptocurrency"
      limit: 5

  - name: "Search Meme Coins ATH"
    description: "Get All-Time High data for meme coins"
    function_call: "get_messari_asset_ath(search='meme', limit=3)"
    parameters:
      search: "meme"
      limit: 3

messari_asset_details_examples:
  - name: "Get Bitcoin and Ethereum Details by Slug"
    description: "Get detailed information for Bitcoin and Ethereum using their slugs"
    function_call: "get_messari_asset_details(slugs=['bitcoin', 'ethereum'])"
    parameters:
      slugs: ["bitcoin", "ethereum"]

  - name: "Get Bitcoin and Ethereum Details by ID"
    description: "Get detailed information for Bitcoin and Ethereum using their UUIDs"
    function_call: "get_messari_asset_details(ids=['1e31218a-e44e-4285-820c-8282ee222035', '21c795f5-1bfd-40c3-858e-e9d7e820c6d0'])"
    parameters:
      ids: 
        - "1e31218a-e44e-4285-820c-8282ee222035"  # Bitcoin UUID
        - "21c795f5-1bfd-40c3-858e-e9d7e820c6d0"  # Ethereum UUID

  - name: "Get Default Asset Details"
    description: "Get details using default parameters (Bitcoin and Ethereum)"
    function_call: "get_messari_asset_details()"
    parameters:
      default_slugs: "bitcoin,ethereum"

messari_asset_roi_examples:
  - name: "Get Bitcoin and Ethereum ROI"
    description: "Get Return-on-Investment data for Bitcoin and Ethereum"
    function_call: "get_messari_asset_roi(slugs=['bitcoin', 'ethereum'])"
    parameters:
      slugs: ["bitcoin", "ethereum"]
      limit: 20

  - name: "Get DeFi Assets ROI"
    description: "Get ROI data for top 5 DeFi assets"
    function_call: "get_messari_asset_roi(category='Crypto', limit=5)"
    parameters:
      category: "Crypto"
      limit: 5

  - name: "Search Chain Assets ROI"
    description: "Get ROI data for assets containing 'chain'"
    function_call: "get_messari_asset_roi(search='ETH', tags=['EVM'], limit=3)"
    parameters:
      search: "ETH"
      tags: ["EVM"]
      limit: 3

  - name: "Get Default ROI Data"
    description: "Get ROI data using default parameters"
    function_call: "get_messari_asset_roi()"
    parameters:
      default_slugs: "bitcoin,ethereum"
      limit: 20

messari_news_assets_examples:
  - name: "Get All News Assets"
    description: "Get list of all assets that have been tagged in news articles"
    function_call: "get_messari_news_assets()"
    parameters:
      page: 1
      limit: 20

  - name: "Search Bitcoin News Assets"
    description: "Search for Bitcoin-related assets in news articles"
    function_call: "get_messari_news_assets(name_or_symbol='Bitcoin')"
    parameters:
      name_or_symbol: "Bitcoin"
      page: 1
      limit: 20

  - name: "Get More News Assets"
    description: "Get more results per page"
    function_call: "get_messari_news_assets(limit=50)"
    parameters:
      page: 1
      limit: 50

  - name: "Get Second Page of News Assets"
    description: "Get the second page of news assets"
    function_call: "get_messari_news_assets(page=2)"
    parameters:
      page: 2
      limit: 20

messari_news_feed_examples:
  - name: "Get Latest News"
    description: "Get latest news articles using default parameters"
    function_call: "get_messari_news_feed()"
    parameters:
      sort: 2
      page: 1
      limit: 25

  - name: "Get Bitcoin and Ethereum News"
    description: "Get news articles about Bitcoin and Ethereum"
    function_call: "get_messari_news_feed(asset_ids=['1e31218a-e44e-4285-820c-8282ee222035', '21c795f5-1bfd-40c3-858e-e9d7e820c6d0'])"
    parameters:
      asset_ids:
        - "1e31218a-e44e-4285-820c-8282ee222035"  # Bitcoin UUID
        - "21c795f5-1bfd-40c3-858e-e9d7e820c6d0"  # Ethereum UUID
      sort: 2
      page: 1
      limit: 25

  - name: "Get Blog and Forum News"
    description: "Get news articles from blogs and forums"
    function_call: "get_messari_news_feed(source_types=['Blog', 'Forum'], limit=10)"
    parameters:
      source_types: ["Blog", "Forum"]
      sort: 2
      page: 1
      limit: 10

  - name: "Get Recent News"
    description: "Get news articles from the last 24 hours"
    function_call: "get_messari_news_feed(published_after=one_day_ago, limit=5)"
    parameters:
      published_after: "24 hours ago (timestamp in milliseconds)"
      sort: 2
      page: 1
      limit: 5

messari_news_sources_examples:
  - name: "Get All News Sources"
    description: "Get list of all news sources monitored by Messari"
    function_call: "get_messari_news_sources()"
    parameters:
      page: 1
      limit: 100

  - name: "Search Specific News Source"
    description: "Search for a specific news source by name"
    function_call: "get_messari_news_sources(source_name='CoinDesk')"
    parameters:
      source_name: "CoinDesk"
      page: 1
      limit: 100

  - name: "Get More News Sources"
    description: "Get more results per page"
    function_call: "get_messari_news_sources(limit=200)"
    parameters:
      page: 1
      limit: 200

  - name: "Get Second Page of News Sources"
    description: "Get the second page of news sources"
    function_call: "get_messari_news_sources(page=2)"
    parameters:
      page: 2
      limit: 100

messari_signal_assets_examples:
  - name: "Get All Signal Assets"
    description: "Get list of all assets sorted by mindshare"
    function_call: "get_messari_signal_assets()"
    parameters:
      page: 1
      limit: 20

  - name: "Get Bitcoin Signal Asset"
    description: "Get Bitcoin signal asset by ID"
    function_call: "get_messari_signal_asset_by_id('bitcoin')"
    parameters:
      asset_id: "bitcoin"

  - name: "Get Ethereum Mindshare"
    description: "Get Ethereum mindshare over time"
    function_call: "get_messari_signal_asset_mindshare('ethereum')"
    parameters:
      asset_id: "ethereum"


